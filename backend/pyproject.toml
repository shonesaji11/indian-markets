[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "markets"
version = "0.1.0"
description = "Personal Indian markets data platform: ingestion, storage, calculations, API"
requires-python = ">=3.9"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "xgboost==2.1.4",  # big-movers model (pipelines/movers.py); pinned: the model files are tied to it
]

[project.optional-dependencies]
angelone = ["smartapi-python>=1.4", "pyotp>=2.9", "logzero", "websocket-client"]
dev = ["pytest>=8"]

[project.scripts]
markets = "markets.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"markets.storage.duckdb" = ["migrations/*.sql"]
"markets" = ["models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
